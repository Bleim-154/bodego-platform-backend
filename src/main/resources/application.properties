
# Spring Application
spring.application.name=bodego-platform

# Server Configuration
server.port=8091

# PostgreSQL DataSource
spring.datasource.url=jdbc:postgresql://localhost:5432/bodego_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Spring Data JPA
spring.jpa.database=postgresql
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true

# Schema changes require a separately authorized migration operation.
spring.flyway.enabled=false
spring.flyway.default-schema=public
spring.flyway.schemas=public
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-version=1
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
spring.flyway.create-schemas=false

# Custom Hibernate Naming Strategy
# External stable Base64 secret, at least 32 random decoded bytes. No demo fallback.
bodego.security.jwt.secret-base64=${JWT_SECRET_BASE64:}
bodego.security.jwt.issuer=${JWT_ISSUER:bodego-api}
bodego.security.jwt.ttl=${JWT_TTL:PT15M}
bodego.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
# Admission is process-local. Keep the socket peer; untrusted forwarded headers cannot change quotas.
server.forward-headers-strategy=none
bodego.security.login-rate-limit.window=${LOGIN_RATE_LIMIT_WINDOW:PT1M}
bodego.security.login-rate-limit.origin-attempts=${LOGIN_RATE_LIMIT_ORIGIN_ATTEMPTS:30}
bodego.security.login-rate-limit.account-attempts=${LOGIN_RATE_LIMIT_ACCOUNT_ATTEMPTS:5}
bodego.security.login-rate-limit.total-attempts=${LOGIN_RATE_LIMIT_TOTAL_ATTEMPTS:100}
bodego.security.login-rate-limit.max-keys=${LOGIN_RATE_LIMIT_MAX_KEYS:4096}
bodego.security.login-rate-limit.max-concurrent=${LOGIN_RATE_LIMIT_MAX_CONCURRENT:4}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
spring.jpa.hibernate.naming.physical-strategy=com.bodego.platform.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

