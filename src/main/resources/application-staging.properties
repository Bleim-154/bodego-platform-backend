# Explicit staging configuration. Never inherit the local datasource destination.
server.address=0.0.0.0
server.port=${PORT:10000}
server.forward-headers-strategy=none
spring.datasource.url=${DB_JDBC_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.data-source-properties.sslmode=${DB_SSLMODE:verify-full}
spring.datasource.hikari.data-source-properties.sslfactory=org.postgresql.ssl.DefaultJavaSSLFactory
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.schema=public
spring.datasource.hikari.connection-timeout=5000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=public
spring.flyway.enabled=false
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.out-of-order=false
spring.flyway.create-schemas=false
bodego.security.jwt.secret-base64=${JWT_SECRET_BASE64:}
bodego.security.jwt.issuer=${JWT_ISSUER:bodego-api}
bodego.security.jwt.ttl=${JWT_TTL:PT15M}
bodego.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
