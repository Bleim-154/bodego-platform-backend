# Fail closed: no Spring test may inherit the development database or DB_PASSWORD.
# Container-backed tests override these values explicitly with DynamicPropertySource.
spring.datasource.url=jdbc:postgresql://127.0.0.1:1/bodego_tests_require_testcontainers
spring.datasource.username=blocked_without_testcontainer
spring.datasource.password=unused-test-only
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=false
spring.flyway.default-schema=public
spring.flyway.schemas=public
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-version=1
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
spring.flyway.create-schemas=false
spring.jpa.hibernate.naming.physical-strategy=com.bodego.platform.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
